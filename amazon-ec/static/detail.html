<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品詳細 - ALI BABA SHOP</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html">🛒 ALI BABA SHOP</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link active">商品一覧</a>
            <a href="cart.html" class="nav-link">🛒 カート</a>
            <a href="orders.html" class="nav-link">📦 注文履歴</a>
        </nav>
        <div class="auth-buttons">
            <a href="login.html" class="btn btn-login">ログイン</a>
            <a href="register.html" class="btn btn-register">会員登録</a>
        </div>
    </header>
    <main class="container">
        <div id="product-detail" class="product-card">
            <div id="product-image"></div>
            <h1 id="product-name">読み込み中...</h1>
            <p class="price" id="product-price"></p>
            <div class="order-form">
                <label for="quantity">数量:</label>
                <input type="number" id="quantity" value="1" min="1">
                <button id="order-btn">注文する</button>
                <button id="add-to-cart-btn">カートに入れる</button>
            </div>
        </div>
        <div id="message" class="message"></div>
    </main>
    <script src="detail.js"></script>
</body>
</html>
