<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="index.html">🛒 ALI BABA SHOP</a>
        <div class="auth-buttons">
            <a href="login.html" class="btn btn-login">ログイン</a>
            <a href="register.html" class="btn btn-register">会員登録</a>
        </div>
    </header>
    <main class="container">
        <div class="auth-card">
            <h1>会員登録</h1>
            <form id="register-form">
                <div class="field"><label>ユーザー名 <input id="username" required></label></div>
                <div class="field"><label>パスワード（8文字以上） <input id="password" type="password" minlength="8" required></label></div>
                <button type="submit">登録</button>
            </form>
            <p id="message" role="status"></p>
        </div>
    </main>
    <script src="register.js"></script>
</body>
</html>
